<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link da apresentação — Bem Lembrado</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 210mm; height: 297mm; }
    body {
      display: grid;
      place-items: center;
      padding: 28mm;
      background: #f7f9f8;
      color: #17211d;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: 100%;
      padding: 26mm 18mm;
      text-align: center;
      background: #fff;
      border: 1px solid #dce8e2;
      border-radius: 8mm;
    }
    .label {
      margin: 0 0 7mm;
      color: #168b59;
      font-size: 11pt;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #164e63;
      font-size: 30pt;
      line-height: 1.1;
    }
    .description {
      margin: 8mm auto;
      max-width: 130mm;
      color: #62736c;
      font-size: 14pt;
      line-height: 1.5;
    }
    a {
      display: block;
      margin: 12mm 0 8mm;
      padding: 8mm;
      color: #075f3e;
      background: #e8f7ef;
      border: 1px solid #cce9da;
      border-radius: 5mm;
      font-size: 15pt;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .instructions {
      margin: 0;
      color: #49635a;
      font-size: 12pt;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Projeto acadêmico</p>
    <h1>Bem Lembrado</h1>
    <p class="description">Apresentação web do projeto de apoio à rotina da pessoa idosa pelo WhatsApp.</p>
    <a href="https://davicondeg.github.io/bem-lembrado-apresentacao/">https://davicondeg.github.io/<wbr>bem-lembrado-apresentacao/</a>
    <p class="instructions">Clique no endereço acima ou copie e cole o link no navegador.<br>Use as setas do teclado para avançar e voltar pelos slides.</p>
  </main>
</body>
</html>
